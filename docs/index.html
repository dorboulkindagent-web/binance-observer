<!doctype html><html dir="rtl" lang="he"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Observer</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0}.w{max-width:850px;margin:auto;padding:18px}.c{background:#151c31;border:1px solid #29334f;border-radius:18px;padding:18px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.p{font-size:30px;font-weight:800}.b{display:inline-block;background:#123d32;color:#7fffc9;padding:7px 12px;border-radius:99px}.warn{color:#ffd982}@media(max-width:600px){.g{grid-template-columns:1fr}}</style><div class=w><div class=c><span class=b>OBSERVE ONLY</span><h1>Binance Observer</h1><p>ניטור נתוני שוק ציבוריים בלבד. אין גישה לחשבון ואין קנייה או מכירה.</p></div><div id=s class=c>טוען…</div><div id=g class=g></div><div class="c warn">הנתונים מתעדכנים באמצעות GitHub Actions. התזמון אינו שרת רציף ועלול להתעכב.</div></div><script>async function r(){try{let x=await fetch('data.json?'+Date.now()).then(r=>r.json());s.innerHTML='<b>עדכון אחרון:</b> '+new Date(x.updated_at).toLocaleString('he-IL');g.innerHTML=Object.entries(x.symbols).map(([k,v])=>'<div class=c><b>'+k+'</b><div class=p>'+v.price.toLocaleString()+'</div><div>EMA9 '+v.ema9.toLocaleString()+'</div><div>EMA21 '+v.ema21.toLocaleString()+'</div></div>').join('')}catch(e){s.textContent='ממתין להרצת האיסוף הראשונה'}}r();setInterval(r,60000)</script></html>
