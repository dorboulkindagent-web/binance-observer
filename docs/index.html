<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Radar</title><style>
*{box-sizing:border-box}body{margin:0;background:#09111f;color:#f4f7fc;font-family:Arial,sans-serif}.w{max-width:900px;margin:auto;padding:16px}.head,.panel,.coin{background:#121d30;border:1px solid #263752;border-radius:16px;padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:26px}.green{color:#62e6a9}.red{color:#ff9696}.muted{color:#9eafc8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#121d30;border-radius:14px;padding:12px}.stats b{display:block;font-size:22px}.scenario{margin-top:12px;padding:11px;background:#0b1423;border-radius:10px}.scenario b{display:block;margin-bottom:4px}.opps{background:#121d30;border:1px solid #263752;border-radius:16px;padding:16px;margin:12px 0}.opps h2{margin:0 0 6px}.opp-list{display:grid;gap:8px;margin-top:12px}.opp{background:#0b1423;border-radius:12px;padding:12px;cursor:pointer}.opp-top{display:flex;justify-content:space-between;gap:10px}.filters{display:flex;gap:7px;overflow:auto;margin:14px 0}.filters button{padding:9px 12px;border:0;border-radius:20px;background:#1b2940;color:white;white-space:nowrap}.filters .on{background:white;color:#142038}.coin{cursor:pointer}.top{display:flex;justify-content:space-between;gap:12px}.symbol{font-size:20px;font-weight:bold;direction:ltr}.score{font-size:24px;font-weight:bold}.pill{display:inline-block;padding:5px 8px;border-radius:8px;font-size:12px;margin-top:5px}.pill.up{background:#12382e;color:#76eab6}.pill.down{background:#3a2028;color:#ff9caa}.why{margin-top:12px}.mini{display:flex;gap:16px;flex-wrap:wrap;color:#b7c5d9;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#050913ee;padding:15px;overflow:auto}.modal.open{display:block}.sheet{max-width:700px;margin:25px auto;background:#121d30;border-radius:18px;padding:18px}.close{float:left;border:0;border-radius:8px;padding:8px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#0b1423;border-radius:10px;padding:10px}.box small{display:block;color:#9eafc8}@media(max-width:600px){.w{padding:12px}.head h1{font-size:23px}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><main class=w><div class=head><div><h1>Binance Radar</h1><div class=muted>סריקת שוק וניתוח מטבעות</div></div><b class=green>● פעיל</b></div><div id=status class=panel>טוען נתונים...</div><div class=stats><div><small class=muted>זוגות</small><b id=u>—</b></div><div><small class=muted>נותחו</small><b id=a>—</b></div><div><small class=muted>התראות</small><b id=n>—</b></div></div><section class=opps><h2>מועמדים למחקר</h2><div class=muted>המטבעות הבולטים כרגע לפי תנאים טכניים ונזילות. לא המלצת קנייה.</div><div id=opps class=opp-list></div></section><div class=filters><button class=on data-f=all>הכל</button><button data-f=up>🟢 עלייה</button><button data-f=down>🔴 ירידה</button></div><div id=list></div><div class=panel><small class=muted>התראות הן ניתוח טכני למעקב בלבד. אין קנייה או מכירה באפליקציה.</small></div></main><div id=modal class=modal><div class=sheet><button class=close id=close>סגור</button><div id=detail></div></div></div><script>
var DATA=null,FILTER="all";function num(x){return Number(x).toLocaleString("en-US",{maximumFractionDigits:8})}function textReason(x){var z=[];z.push(x.kind==="BREAKOUT_SETUP"?"קרוב לאזור פריצה":"סיכון באזור תמיכה");if(x.volume_ratio>=1.5)z.push("נפח גבוה מהרגיל");z.push(x.ema9>x.ema21?"מגמה קצרה חיובית":"מגמה קצרה חלשה");return z.join(" · ")}
function drawOpps(){var q=(DATA.alerts||[]).slice().sort(function(x,y){return y.score-x.score||y.quote_volume_24h-x.quote_volume_24h}).slice(0,5);opps.innerHTML=q.map(function(x){var up=x.kind==="BREAKOUT_SETUP";return '<div class=opp data-o="'+x.symbol+'"><div class=opp-top><b dir=ltr>'+x.symbol+'</b><b>'+x.score+'/100</b></div><span class="pill '+(up?'up':'down')+'">'+(up?'🟢 מעקב לפריצה':'🔴 סיכון לשבירה')+'</span><div class=muted>'+textReason(x)+'</div></div>'}).join('');document.querySelectorAll('[data-o]').forEach(function(el){el.onclick=function(){show(el.dataset.o)}})}function draw(){drawOpps();var rows=(DATA.alerts||[]).filter(function(x){return FILTER==="all"||(FILTER==="up"&&x.kind==="BREAKOUT_SETUP")||(FILTER==="down"&&x.kind==="BREAKDOWN_RISK")});list.innerHTML=rows.map(function(x){var up=x.kind==="BREAKOUT_SETUP";return '<div class="coin" data-s="'+x.symbol+'"><div class=top><div><div class=symbol>'+x.symbol+'</div><span class="pill '+(up?'up':'down')+'">'+(up?'🟢 מעקב לפריצה':'🔴 סיכון לשבירה')+'</span></div><div class=score>'+x.score+'/100</div></div><div class=why>'+textReason(x)+'</div><div class=mini><span>מחיר $'+num(x.price)+'</span><span>RSI '+x.rsi+'</span><span>נפח ×'+x.volume_ratio+'</span></div></div>'}).join("");document.querySelectorAll(".coin").forEach(function(el){el.onclick=function(){show(el.dataset.s)}})}
function show(s){var x=(DATA.alerts||[]).find(function(q){return q.symbol===s});if(!x)return;var f=x.fundamental;detail.innerHTML='<h2 dir=ltr>'+x.symbol+'</h2><div class=scenario><b>תרחיש למעקב</b><div>'+(x.kind===\"BREAKOUT_SETUP\"?\"התחזקות: סגירה מעל ההתנגדות יחד עם נפח גבוה. היחלשות: חזרה מתחת לאזור ההתנגדות או ירידה במומנטום.\":\"התחזקות הסיכון: סגירה מתחת לתמיכה יחד עם נפח גבוה. היחלשות הסיכון: חזרה מעל התמיכה ושיפור במומנטום.\")+'</div></div><h3>📈 ניתוח טכני</h3><div class=grid><div class=box><small>מחיר</small>$'+num(x.price)+'</div><div class=box><small>ציון</small>'+x.score+'/100</div><div class=box><small>RSI</small>'+x.rsi+'</div><div class=box><small>נפח מול ממוצע</small>×'+x.volume_ratio+'</div><div class=box><small>EMA9</small>'+num(x.ema9)+'</div><div class=box><small>EMA21</small>'+num(x.ema21)+'</div><div class=box><small>תמיכה</small>$'+num(x.support)+'</div><div class=box><small>התנגדות</small>$'+num(x.resistance)+'</div></div><h3>🧩 ניתוח פונדמנטלי</h3>'+(f?'<div class=grid><div class=box><small>שם</small>'+f.name+'</div><div class=box><small>דירוג שוק</small>#'+(f.rank||"—")+'</div><div class=box><small>Market Cap</small>$'+(f.market_cap?Math.round(f.market_cap).toLocaleString():"—")+'</div><div class=box><small>שינוי 24 שעות</small>'+(f.percent_change_24h==null?"—":f.percent_change_24h+"%")+'</div><div class=box><small>שינוי 7 ימים</small>'+(f.percent_change_7d==null?"—":f.percent_change_7d+"%")+'</div><div class=box><small>Circulating Supply</small>'+(f.circulating_supply?Math.round(f.circulating_supply).toLocaleString():"—")+'</div></div>':'<p class=muted>אין כרגע נתון פונדמנטלי תואם ממקור חיצוני.</p>');modal.classList.add("open")}
close.onclick=function(){modal.classList.remove("open")};modal.onclick=function(e){if(e.target===modal)modal.classList.remove("open")};document.querySelectorAll(".filters button").forEach(function(b){b.onclick=function(){document.querySelectorAll(".filters button").forEach(function(q){q.classList.remove("on")});b.classList.add("on");FILTER=b.dataset.f;draw()}});
async function load(){try{var r=await fetch("scanner.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();DATA=await r.json();u.textContent=DATA.universe_count;a.textContent=DATA.analyzed_count;n.textContent=(DATA.alerts||[]).length;status.innerHTML="<b>הסריקה פעילה</b><div class=muted>עדכון אחרון: "+new Date(DATA.updated_at).toLocaleString("he-IL")+"</div>";draw()}catch(e){status.innerHTML="<b class=red>שגיאה בטעינת הנתונים</b><div class=muted>נסה לרענן בעוד מספר דקות</div>"}}load();setInterval(load,60000);
</script></body></html>
