<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Radar</title><style>
:root{color-scheme:dark;--bg:#08101d;--panel:#101a2b;--line:#21304a;--muted:#94a5bf;--up:#48d597;--down:#ff7777;--amber:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f7ff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 0}.hero h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:14px}.live{padding:7px 11px;border-radius:99px;background:#103a2d;color:#8affcf;font-size:12px;font-weight:800}.status,.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px}.status{padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{padding:14px}.stat b{display:block;font-size:24px}.stat small,.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:18px 0 10px;overflow:auto}.tab{border:1px solid var(--line);background:#0d1626;color:#cbd7ea;padding:10px 14px;border-radius:99px;white-space:nowrap;font-weight:700}.tab.on{background:#eaf1ff;color:#101a2b}.list{display:grid;gap:10px}.card{padding:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.coin{font-size:20px;font-weight:850;direction:ltr}.tag{font-size:12px;font-weight:850;padding:6px 9px;border-radius:9px}.up{color:var(--up);background:#0f3028}.down{color:#ff9a9a;background:#381d25}.score{font-size:28px;font-weight:900}.reason{margin:13px 0 6px}.bar{height:7px;background:#202c40;border-radius:9px;overflow:hidden}.fill{height:100%;background:currentColor}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.details div{background:#0c1524;padding:9px;border-radius:10px}.details small{display:block;color:var(--muted)}button{font:inherit;cursor:pointer}.refresh{background:#eaf1ff;color:#102039;border:0;padding:9px 13px;border-radius:10px;font-weight:800}.empty{padding:30px;text-align:center;color:var(--muted)}.note{margin-top:18px;padding:14px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}@media(max-width:620px){.wrap{padding:14px}.hero{align-items:flex-start}.hero h1{font-size:24px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:11px}.stat b{font-size:20px}.details{grid-template-columns:1fr 1fr}.status{align-items:flex-start}.hide-mobile{display:none}}
</style></head><body><main class=wrap><header class=hero><div><h1>Binance Radar</h1><div class=sub>מה קורה בשוק עכשיו — בצורה פשוטה</div></div><span class=live>● ניטור פעיל</span></header>
<section class=status><div><b id=state>טוען נתוני שוק…</b><div id=updated class=sub></div></div><button class=refresh onclick="load()">רענון</button></section>
<section class=stats><div class=stat><small>זוגות בשוק</small><b id=universe>—</b></div><div class=stat><small>נותחו</small><b id=analyzed>—</b></div><div class=stat><small>התראות</small><b id=count>—</b></div></section>
<nav class=tabs><button class="tab on" data-filter=all>הכל</button><button class=tab data-filter=up>🟢 מעקב לעלייה</button><button class=tab data-filter=down>🔴 סיכון לירידה</button></nav>
<section id=list class=list></section><div class=note><b>חשוב:</b> “מעקב לעלייה” ו“סיכון לירידה” הם זיהוי תנאים טכניים בלבד — לא הוראת קנייה/מכירה ולא הסתברות מובטחת. אין באפליקציה ביצוע עסקאות.</div></main><script>
let data=null,filter='all';const fmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:8});
function reason(a){let r=[];if(a.kind==='BREAKOUT_SETUP')r.push('המחיר מתקרב לאזור פריצה');else r.push('המחיר קרוב/מתחת לאזור תמיכה');if(a.volume_ratio>=1.5)r.push('נפח מסחר גבוה מהרגיל');if(a.ema9>a.ema21)r.push('המגמה הקצרה חיובית');else r.push('המגמה הקצרה חלשה');return r.slice(0,3).join(' · ')}
function render(){if(!data)return;let arr=data.alerts||[];if(filter==='up')arr=arr.filter(a=>a.kind==='BREAKOUT_SETUP');if(filter==='down')arr=arr.filter(a=>a.kind==='BREAKDOWN_RISK');list.innerHTML=arr.map(a=>{let up=a.kind==='BREAKOUT_SETUP',level=up?a.resistance:a.support,dist=up?a.distance_resistance_pct:a.distance_support_pct;return '<article class=card><div class=row><div><div class=coin>'+a.symbol.replace('USDT',' / USDT')+'</div><span class="tag '+(up?'up':'down')+'">'+(up?'🟢 מעקב לפריצה':'🔴 סיכון לשבירה')+'</span></div><div style="text-align:left"><div class=score>'+a.score+'<small>/100</small></div><small class=muted>עוצמת התנאים</small></div></div><div class=reason>'+reason(a)+'</div><div class="bar '+(up?'up':'down')+'"><div class=fill style="width:'+Math.min(a.score,100)+'%"></div></div><div class=details><div><small>מחיר</small><b dir=ltr>$'+fmt.format(a.price)+'</b></div><div><small>'+(up?'התנגדות':'תמיכה')+'</small><b dir=ltr>$'+fmt.format(level)+'</b></div><div><small>מרחק מהרמה</small><b dir=ltr>'+Math.abs(dist).toFixed(2)+'%</b></div><div><small>RSI</small><b>'+a.rsi+'</b></div><div><small>נפח מול רגיל</small><b dir=ltr>×'+a.volume_ratio+'</b></div><div><small>תנודתיות ATR</small><b>'+a.atr_pct+'%</b></div></div></article>'}).join('')||'<div class="card empty">אין כרגע התראות בקטגוריה הזאת.</div>'}
async function load(){state.textContent='מעדכן…';try{let x=await fetch('scanner.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});data=x;universe.textContent=x.universe_count??'—';analyzed.textContent=x.analyzed_count??'—';count.textContent=(x.alerts||[]).length;updated.textContent=x.updated_at?'עדכון אחרון: '+new Date(x.updated_at).toLocaleString('he-IL'):'';state.textContent=(x.alerts||[]).length?'נמצאו '+x.alerts.length+' מצבים שכדאי לעקוב אחריהם':'הסריקה תקינה — אין כרגע התראות';render()}catch(e){state.textContent='לא ניתן לטעון נתונים כרגע';updated.textContent='נסה שוב בעוד מספר דקות'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});load();setInterval(load,60000)
</script></body></html>
