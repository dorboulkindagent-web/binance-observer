name: Market Scanner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scanner.py','docs/index.html','.github/workflows/scanner.yml']
  schedule:
    - cron: '3/10 * * * *'
permissions:
  contents: write
concurrency:
  group: market-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scanner.py
      - run: |
          git config user.name "binance-scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scanner.json docs/alerts-history.jsonl
          git diff --cached --quiet || (git commit -m "Update market scan" && git push origin HEAD:main)
