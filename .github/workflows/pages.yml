name: Publish Radar dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Market Scanner']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: radar-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.repository.has_pages == true && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4
