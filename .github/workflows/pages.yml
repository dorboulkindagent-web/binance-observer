name: Publish observer dashboard
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Observe Binance']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: observer-pages
  cancel-in-progress: false
jobs:
  deploy:
    # Never turn a private repository public or enable a website implicitly.
    if: github.event.repository.has_pages == true && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
