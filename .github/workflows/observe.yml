name: Observe Binance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'app.py'
      - 'tests/**'
      - 'docs/index.html'
      - '.github/workflows/observe.yml'
  schedule:
    - cron: '2/10 * * * *'
permissions:
  contents: write
concurrency:
  group: binance-observations
  cancel-in-progress: false
jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect public data
        id: collect
        continue-on-error: true
        run: python collector.py
      - name: Save observations and failure status
        run: |
          git config user.name "binance-observer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Update market observation"
            git push origin HEAD:main
          fi
      - name: Store dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: observer-dashboard
          path: docs/
          retention-days: 3
          include-hidden-files: true
      - name: Report upstream collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::Market data collection was incomplete. Last good observations were preserved; inspect docs/data.json.'
          exit 1
