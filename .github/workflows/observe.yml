name: Observe Binance
on:
  workflow_dispatch:
  schedule:
    - cron: '2/10 * * * *'
permissions:
  contents: write
jobs:
  observe:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collector.py
      - name: Commit observations
        run: |
          git config user.name "binance-observer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history.jsonl
          git diff --cached --quiet || git commit -m "Update market observation"
          git push
