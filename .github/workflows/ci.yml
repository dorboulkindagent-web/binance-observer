name: Test scanner
on:
  push:
    paths-ignore: ['docs/scanner.json','docs/alerts-history.jsonl','docs/data.json','docs/history.jsonl']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner-smoke:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate dashboard and latest scanner payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=Path('docs/index.html').read_text(encoding='utf-8')
          assert '<meta charset="utf-8">' in h
          assert 'Binance Radar' in h
          assert 'ניתוח טכני' in h and 'ניתוח פונדמנטלי' in h
          d=json.loads(Path('docs/scanner.json').read_text(encoding='utf-8'))
          assert d.get('execution') == 'NOT_IMPLEMENTED'
          assert isinstance(d.get('alerts'),list)
          print('dashboard/scanner payload OK')
          PY
